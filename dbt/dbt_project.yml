name: shop
version: "1.0.0"
config-version: 2
profile: shop

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

vars:
  # How many days of events the incremental funnel model re-reads on every run.
  # This is the window in which late-arriving events are absorbed.
  funnel_lookback_days: 3

models:
  shop:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
